# U880: Linux has no per-device Wi-Fi MAC (Android keeps it in /mnt/vendor/persist/nv/wlan_mac.bin), so the
# WCN6750 comes up with Qualcomm's placeholder 00:03:7f:12:34:56, shared by every device -> use a stable
# per-network address derived from /etc/machine-id instead.
[connection]
wifi.cloned-mac-address=stable
