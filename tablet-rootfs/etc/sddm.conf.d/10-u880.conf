# Wayland greeter on the panel's DRM card (card numbers move; by-path does not), touch login theme with the Qt on-screen keyboard.
[General]
DisplayServer=wayland
# empty: SDDM defaults to qtvirtualkeyboard, which conflicts with the input method KWin runs
InputMethod=

[Theme]
Current=u880

[Wayland]
CompositorCommand=env KWIN_DRM_DEVICES=/dev/dri/by-path/platform-ae01000.display-controller-card kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Users]
RememberLastUser=true
RememberLastSession=true
