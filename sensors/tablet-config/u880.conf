# U880: serve /usr/share/qcom/u880 (vendor sensor configs, static socinfo); the sensors registry is writable in
# /var/lib/hexagonrpcd/persist-sensors (hexagonrpcd local patch: fwrite/frename/fremove/large buffers).
[Service]
Environment=HEXAGONRPCD_PERSIST_RW=/var/lib/hexagonrpcd/persist-sensors
ExecStart=
ExecStart=/usr/local/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/u880
[Unit]
Before=iio-sensor-proxy.service
