# U880 (SM7675) power-saver: caps all clusters near their efficient knee, GPU at 500 MHz max.
[main]
summary=U880 power saver: capped CPU and GPU clocks

[cpu]
governor=schedutil

[sysfs]
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1478400
/sys/devices/system/cpu/cpufreq/policy3/scaling_max_freq=1401600
/sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq=1209600
/sys/class/devfreq/3d00000.qcom,kgsl-3d0/max_freq=500000000
