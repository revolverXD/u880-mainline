SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."HDMI1" {
	Comment "DisplayPort over USB-C (MultiMedia2 -> DISPLAY_PORT_RX_0)"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 1000
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP0 Jack"
		JackHWMute "Speaker"
	}
}
